# Las credenciales se leen de variables de entorno o del archivo .env
# (ignorado por git). Ver .env.example.
spring:
  application:
    name: microservicio-productos-ventas
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/db_microservicios?serverTimezone=America/Mexico_City}
    username: ${DB_USERNAME:micro_user}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # el esquema lo gestiona Flyway, no Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Mexico_City
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: America/Mexico_City
    deserialization:
      # Rechaza 1.5 en campos enteros (stock, cantidad) en lugar de truncarlo a 1
      accept-float-as-int: false
      fail-on-null-for-primitives: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.proyecto.microservicio: INFO
